[package]
name = "carbon-program-decoder"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
[workspace]

[lib]
crate-type = ["rlib"]

[features]
default = []

serde = ["dep:serde"]

base58 = ["serde"]

[dependencies]
carbon-core = { version = "2.0.0", features = ["macros"], default-features = false }
borsh = { version = "1.5.1", features = ["derive"] }
solana-pubkey = { version = "4.2.1", features = ["borsh"] }
solana-account = "4.3.2"
solana-instruction = { version = "3.4.1", default-features = false }
serde_json = "1.0.145"

serde = { version = "1.0.228", features = ["derive"], optional = true }


[dev-dependencies]
carbon-test-utils = "2.0.0"
