[package]
name = "microscope-indexer"
version = "0.1.0"
edition.workspace = true
description = "Self-hosted monitoring and alerting for Solana programs"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "microscope-indexer"
path = "src/main.rs"

[dependencies]
carbon-core = "2.0.0"
carbon-yellowstone-grpc-datasource = "2.0.0"
carbon-log-metrics = "2.0.0"
# generated by `just generate`
carbon-program-decoder = { path = "../program-decoder", features = ["base58"] }
carbon-squads-v3-decoder = { package = "carbon-squads-mpl-decoder", path = "../squads-v3-decoder", features = ["serde"] }
carbon-squads-v4-decoder = { package = "carbon-squads-multisig-program-decoder", path = "../squads-v4-decoder", features = ["serde"] }
carbon-squads-smart-account-decoder = { package = "carbon-squads-smart-account-program-decoder", path = "../squads-smart-account-decoder", features = ["serde"] }
yellowstone-grpc-proto = "12.7.0"
yellowstone-grpc-client = "13.5.0"
solana-signature = "3.4.1"
solana-pubkey = "4.0.0"
solana-instruction = "3.0.0"
tokio = { version = "1.52.3", features = ["full"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.3"
rustls = { version = "0.23.41", default-features = false, features = ["std", "ring"] }
env_logger = "0.11.11"
log = "0.4.33"
anyhow = "1.0.103"
serde_json = "1.0.150"
clap = { version = "4.6.2", features = ["derive"] }
heck = "0.5.0"
regex = "1.13.0"
sha2 = "0.10.9"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json"] }
solana-client = "4.2.2"
solana-commitment-config = "3.1.1"
solana-transaction-status = { version = "4.2.2", features = ["agave-unstable-api"] }
async-trait = "0.1.89"
futures = "0.3.32"
tokio-util = "0.7.18"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }

[dev-dependencies]
base64 = "0.22.1"
borsh = "1.5.1"
chrono = "0.4.45"
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
solana-hash = "4.0.0"
solana-message = "4.2.3"
solana-transaction = "4.0.0"
wincode = "0.5.5"
