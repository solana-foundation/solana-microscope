auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Keep the local event history short; long-term storage is out of scope.
  retention_period: 720h
  # Let `microscope-indexer backfill` push samples backdated up to the full
  # retention window; the Loki default (1w) would reject most of it.
  reject_old_samples: true
  reject_old_samples_max_age: 720h

# retention_period is only enforced when the compactor has retention enabled.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
