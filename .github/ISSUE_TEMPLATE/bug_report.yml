name: Bug report
description: Report a reproducible problem with Solana Microscope
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private keys, Terraform state, or unredacted deployment logs.
        Report security vulnerabilities through the private advisory link in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, branch, or commit SHA where the problem occurs.
      placeholder: main at abc1234
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Deployment environment
      options:
        - Local Docker Compose
        - AWS
        - Google Cloud
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Include relevant logs or configuration only after removing secrets and identifying data.
      render: shell
