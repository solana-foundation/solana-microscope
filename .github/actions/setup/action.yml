name: Setup CI environment
description: Set up the Rust, Node.js, Python, npm, and Just toolchain used by Microscope

inputs:
  install-rust:
    description: Install the Rust toolchain
    required: false
    default: 'true'
  rust-toolchain:
    description: Rust toolchain to install
    required: false
    default: '1.97'
  rust-components:
    description: Rust components to install
    required: false
    default: rustfmt, clippy
  enable-rust-cache:
    description: Restore and save the Rust build cache
    required: false
    default: 'true'
  save-rust-cache:
    description: Save new Rust cache entries from this job
    required: false
    default: 'false'
  rust-cache-key:
    description: Shared Rust cache key
    required: false
    default: ci
  install-node:
    description: Install Node.js
    required: false
    default: 'true'
  install-node-dependencies:
    description: Install lockfile-pinned npm dependencies
    required: false
    default: 'true'
  install-python:
    description: Install Python
    required: false
    default: 'true'
  install-just:
    description: Install Just
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Rust
      if: inputs.install-rust == 'true'
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: ${{ inputs.rust-components }}

    - name: Cache Rust build artifacts
      if: inputs.install-rust == 'true' && inputs.enable-rust-cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        workspaces: '. -> target'
        shared-key: ${{ inputs.rust-cache-key }}
        save-if: ${{ inputs.save-rust-cache }}
        cache-on-failure: true

    - name: Set up Node.js
      if: inputs.install-node == 'true'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install npm dependencies
      if: inputs.install-node == 'true' && inputs.install-node-dependencies == 'true'
      shell: bash
      run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund

    - name: Set up Python
      if: inputs.install-python == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version-file: .python-version

    - name: Install Just
      if: inputs.install-just == 'true'
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: '1.50.0'
