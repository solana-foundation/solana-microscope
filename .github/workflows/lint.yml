name: Lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup
        with:
          rust-cache-key: rust-dev
          save-rust-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Clippy
        run: just lint-check

      - name: Run Clippy against a program whose IDL declares no events
        run: |
          cat > microscope.toml <<'TOML'
          program_id = "11111111111111111111111111111111"
          idl_path = "crates/microscope-indexer/tests/fixtures/idl-without-events.json"
          TOML
          just lint-check
