name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      program_id:
        description: Program ID the decoder is generated for; comma-separated for several programs
        required: true
        type: string
      idl_path:
        description: Repository-relative path to the program IDL; comma-separated, one per program ID in the same order
        required: true
        default: idl/idl1.json
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ inputs.program_id }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and publish deployment image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Seed the build configuration
        id: seed
        env:
          PROGRAM_ID: ${{ inputs.program_id }}
          IDL_PATH: ${{ inputs.idl_path }}
        run: ./scripts/seed-publish-config.sh

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.seed.outputs.tag }}
            type=sha,prefix=${{ steps.seed.outputs.tag }}-,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Deployment image published"
            echo
            echo "**Tags:**"
            echo "$TAGS" | sed 's/^/- `/;s/$/`/'
            echo
            echo "The image carries no \`microscope.toml\`. Mount the deployment config at"
            echo "\`/etc/microscope/microscope.toml\`; it must name these programs and IDLs, in this order:"
            echo
            echo '```toml'
            cat microscope.toml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
