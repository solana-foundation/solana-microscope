name: Audit Fix

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: audit-fix
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          install-node-dependencies: 'false'
          install-python: 'false'
          install-just: 'false'
          enable-rust-cache: 'false'
      - uses: taiki-e/install-action@5ebac0d9522d786674368e47e92963ba13f2c376 # v2.82.11
        with:
          tool: cargo-audit

      - name: Fix vulnerable npm packages
        run: npm audit fix --package-lock-only --ignore-scripts --legacy-peer-deps || true

      - name: Stub gitignored generated crates so cargo can resolve the workspace
        run: |
          for manifest in $(git ls-files 'crates/*/Cargo.toml'); do
            src="$(dirname "$manifest")/src"
            [ -e "$src" ] || { mkdir -p "$src" && touch "$src/lib.rs"; }
          done

      - name: Update vulnerable crates
        run: |
          cargo audit --json \
            | jq -r '.vulnerabilities.list[].package | "\(.name)@\(.version)"' \
            | sort -u \
            | xargs -r -n1 cargo update -p

      - name: Verify audits pass
        run: |
          npm audit --audit-level=high
          cargo audit

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: fix/audit-advisories
          delete-branch: true
          sign-commits: true
          commit-message: 'fix(deps): resolve npm and cargo audit advisories'
          title: 'fix(deps): resolve npm and cargo audit advisories'
          body: |
            Automated by the `Audit Fix` workflow: `npm audit fix` for npm advisories and `cargo update -p` for vulnerable crates, then the audits re-run clean.

            Approve the pending workflow runs to start CI, and review forced overrides for major-version jumps before merging.
