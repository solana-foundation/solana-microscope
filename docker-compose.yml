# Loki keeps the queryable history (30-day retention); the raw container logs
# only need to cover the shipping window, never fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  indexer:
    build: .
    image: solana-microscope-indexer:local
    restart: unless-stopped
    logging: *default-logging
    environment:
      GEYSER_URL: ${GEYSER_URL:-}
      GEYSER_X_TOKEN: ${GEYSER_X_TOKEN:-}
      RPC_URL: ${RPC_URL:-}
      MICROSCOPE_STATE_DIR: /var/lib/solana-microscope
      MICROSCOPE_STREAM_STALE_AFTER_SECONDS: ${MICROSCOPE_STREAM_STALE_AFTER_SECONDS:-}
      RUST_LOG: info
    ports:
      # localhost-only: reach from outside via SSH tunnel, never the public IP
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9091:9091"
    volumes:
      - ./microscope.toml:/etc/microscope/microscope.toml:ro
      - indexer-state:/var/lib/solana-microscope

  alerting-config:
    image: solana-microscope-indexer:local
    restart: "no"
    command:
      - generate-alerting
      - /etc/microscope/microscope.toml
      - /etc/grafana-alerting
      - /etc/grafana-dashboards
    environment:
      RPC_URL: ${RPC_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      PAGERDUTY_INTEGRATION_KEY: ${PAGERDUTY_INTEGRATION_KEY:-}
    volumes:
      - ./microscope.toml:/etc/microscope/microscope.toml:ro
      - grafana-alerting:/etc/grafana-alerting
      - grafana-dashboards:/etc/grafana-dashboards

  prometheus:
    image: prom/prometheus:v3.13.1@sha256:bd2dcadfb0d1096e2a4c21817ac7af918e2f19ff628e4bf25fd67a924c13dd80
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.7.3@sha256:d14b3a2c419b72fe27cd094c017863bd37a5ea9ac7d72f35bcd25f5bd081dc47
    restart: unless-stopped
    logging: *default-logging
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.17.1@sha256:f298ad6f9c6fe13be8bccb32984ca156f65bb283aa959f1dacfecf26427878c6
    restart: unless-stopped
    logging: *default-logging
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must resolve to the compose project name}
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # :ro does not limit Docker API access; this grants host-level control.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

  grafana:
    image: grafana/grafana:13.1.0@sha256:6ea068891652aa6a65ca9065c26b89de939653803c836426970305c11fd00534
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      PAGERDUTY_INTEGRATION_KEY: ${PAGERDUTY_INTEGRATION_KEY:-}
    depends_on:
      alerting-config:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    ports:
      # localhost-only: reach from outside via SSH tunnel, never the public IP
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-alerting:/etc/grafana/provisioning/alerting:ro
      - grafana-dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  indexer-state:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
  grafana-alerting:
  grafana-dashboards:
